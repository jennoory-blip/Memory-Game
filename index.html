<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>기억 게임</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 화면 하나가 가운데, 위에 얇은 상태 표시줄 (조건은 표시하지 않음 — 커버스토리 보호) */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2a41; --muted:#5f6b7d; --line:#d9dee6;
  --accent:#2a9d8f; --accent-ink:#ffffff; --warn:#b4532a; --warn-bg:#fbeee7; --ok:#2d7a3e; --ok-bg:#e7f4ea;
  --bubble-me:#e6f4f2; --bubble-them:#eef1f6;
  --av-hu:#f6e3cc; --av-hu-ink:#8a5424; --av-ai:#dde6f3; --av-ai-ink:#2c4c78; --av-me:#d6efeb; --av-me-ink:#1f6f66;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --ink:#e4e9f1; --muted:#9aa5b5; --line:#2c3440;
  --accent:#3bb5a6; --accent-ink:#0d1a18; --warn:#f0a07c; --warn-bg:#3a241b; --ok:#8fd8a0; --ok-bg:#1c3324;
  --bubble-me:#173431; --bubble-them:#242c38;
  --av-hu:#3d2e1f; --av-hu-ink:#f0c595; --av-ai:#1f2c3d; --av-ai-ink:#9cc0ef; --av-me:#173431; --av-me-ink:#8fd8cd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --ink:#e4e9f1; --muted:#9aa5b5; --line:#2c3440;
  --accent:#3bb5a6; --accent-ink:#0d1a18; --warn:#f0a07c; --warn-bg:#3a241b; --ok:#8fd8a0; --ok-bg:#1c3324;
  --bubble-me:#173431; --bubble-them:#242c38;
  --av-hu:#3d2e1f; --av-hu-ink:#f0c595; --av-ai:#1f2c3d; --av-ai-ink:#9cc0ef; --av-me:#173431; --av-me-ink:#8fd8cd; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6}
.wrap{max-width:1060px;margin:0 auto;padding-block:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.wide .wrap{max-width:1240px;padding-block:8px 16px}
body.wide #app{padding:12px}
body.wide .topbar{display:none}                 /* 장면 학습 중에는 위 막대를 숨겨 사진을 최대한 크게 */
body.wide .wrap{padding-block:6px}
.topbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.topbar b{font-weight:700;letter-spacing:.02em}
.chip{font-family:var(--f-mono);font-size:14px;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
#app{background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:24px max(16px,5%);min-height:calc(100vh - 100px);box-sizing:border-box;outline:none}
.jspsych-content-wrapper,.jspsych-content{width:100%}
h2{font-size:25px;margin:0 0 12px;text-wrap:balance}
h3{font-size:20px;margin:14px 0 10px}
p{line-height:1.75}
p{margin:0 0 12px}
ul.rules{margin:0 0 12px;padding-left:20px;display:grid;gap:4px}
.muted{color:var(--muted);font-size:16px}
.jspsych-btn,.btn{font:inherit;font-size:17px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 18px;cursor:pointer;margin:6px 6px 0 0}
.jspsych-btn:hover,.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn[hidden]{display:none}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#jspsych-html-button-response-btngroup{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px;justify-content:flex-start}
.jspsych-content:has(.ctr,.tag) #jspsych-html-button-response-btngroup{justify-content:center}
/* 기본은 왼쪽 위부터. 짧은 화면(.ctr: 매칭·순서 정하기·다음 장면, .tag: 재인·출처 문항)만 패널 한가운데로 */
#app:has(.ctr,.tag){display:flex;flex-direction:column;justify-content:center}
.ctr{text-align:center}
.ctr .pcard{display:inline-flex;text-align:left;margin-inline:auto}
.ctr .duel{justify-content:center}
.ctr .slot{flex:0 1 320px;text-align:left}
.ctr .recall-head{justify-content:center;gap:20px}
.cbtn{display:block;margin:16px 0 0}
.ctr .cbtn{margin-inline:auto}
.note{border:2px dashed var(--warn);background:var(--warn-bg);border-radius:8px;padding:12px 18px;margin:12px 0;font-size:19px}
.mtime{font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-top:4px}
.rule{border-left:6px solid var(--accent);padding:14px 20px;font-size:20px;background:var(--bubble-me);border-radius:0 6px 6px 0;margin:12px 0}
.rule.small{font-size:17px;padding:8px 14px;margin:0 0 8px}
.rule .rtitle{display:block;font-size:23px;margin-bottom:2px}
.rule.small .rtitle{display:inline;font-size:17px;margin:0 8px 0 0}
.idbox{display:inline-block;border:1.5px solid var(--accent);border-radius:4px;padding:0 8px;margin:0 2px;font-family:var(--f-mono);font-size:16px;line-height:1.6}
.scale{display:inline-block;max-width:100%}
.scale .ends{max-width:none}
.btnrow{display:flex;flex-wrap:wrap;gap:0;margin-top:8px}
/* 플레이어 표시 */
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.av svg{width:18px;height:18px;fill:currentColor}
.av.hu{background:var(--av-hu);color:var(--av-hu-ink)}
.av.ai{background:var(--av-ai);color:var(--av-ai-ink)}
.av.me{background:var(--av-me);color:var(--av-me-ink)}
.av.big{width:48px;height:48px}.av.big svg{width:28px;height:28px}
.pcard{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:8px 0 16px}
.pcard b{display:block;font-size:21px}
/* 순서 정하기 */
.duel{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.slot{flex:1 1 220px;min-width:0;display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:12px 16px;transition:background .1s,border-color .1s}
.slot b{display:block;font-size:18px;overflow-wrap:anywhere}
.slot.on{border-color:var(--accent);background:var(--bubble-me)}
.result{min-height:28px;font-weight:700}
/* 장면 사진: 잘리지 않게 전체를 보여 줌 */
.scene{display:block;width:100%;height:auto;max-height:calc(100vh - 90px);object-fit:contain;margin:0 auto;border-radius:6px}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;color:var(--muted)}
.study-timer{font-size:22px;font-weight:700;color:var(--ink)}   /* 장면 학습·계산 문제·공동 회상의 남은 시간 표시를 같은 크기로 */
.study-bar{height:8px;border-radius:4px;background:var(--line);margin:4px 0 8px;overflow:hidden}
.study-bar>div{height:100%;width:100%;background:var(--accent);transition:width 1s linear}
/* 공동 회상 */
.recall-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.log{display:flex;flex-direction:column;gap:8px;height:clamp(150px,calc(100vh - 470px),400px);overflow-y:auto;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{justify-content:flex-end}
.msg{max-width:75%;padding:6px 12px;border-radius:12px;font-size:17px;min-width:0;overflow-wrap:anywhere}
.msg small{display:block;font-size:13px;color:var(--muted)}
.msg.me{background:var(--bubble-me)}
.msg.me.pass{color:var(--muted);font-style:italic}
.msg.them{background:var(--bubble-them)}
.msg.typing .txt{color:var(--muted)}
.tdots{display:inline-flex;gap:5px;align-items:center;height:1.4em;vertical-align:middle}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite ease-in-out}
.tdots i:nth-child(2){animation-delay:.15s}.tdots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.caret{display:inline-block;width:2px;height:1em;margin-left:1px;vertical-align:-2px;background:var(--muted);animation:blink 1s steps(1) infinite}
.dots::after{content:"…";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.turnbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-top:8px;min-height:20px}
.turnbar .cnt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.inputrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.inputrow input{flex:1 1 200px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.inputrow input:disabled{opacity:.5}
.inputrow .btn{margin:0}
.warn{min-height:24px;margin-top:8px;font-size:16px;color:var(--warn)}
.warn:not(:empty){background:var(--warn-bg);padding:4px 10px;border-radius:4px}
/* 재인·출처 */
.word{font-size:46px;font-weight:700;text-align:center;margin:36px 0 8px}
.tag{display:block;text-align:center;margin-top:28px;font-size:16px;color:var(--muted)}
.tag + .word{margin-top:4px}
/* 입력 양식 */
.form{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:12px 0}
.form label{display:flex;flex-direction:column;gap:4px;font-size:16px;color:var(--muted)}
.form input,.form select,textarea.ans{font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
fieldset{border:0;padding:0;margin:0 0 8px;min-width:0}
legend{font-weight:500;margin-bottom:5px;padding:0}
.lk{display:flex;gap:6px;flex-wrap:wrap}
.lk label,.opt label{position:relative;cursor:pointer}
.lk input,.opt input{position:absolute;opacity:0;pointer-events:none}
.lk span{display:grid;place-items:center;min-width:40px;height:40px;border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono)}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.opt span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:6px}
.lk input:checked+span,.opt input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lk input:focus-visible+span,.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-top:4px;max-width:340px}
textarea.ans{width:100%;min-height:72px;box-sizing:border-box;resize:vertical}
.preview{font-size:17px;margin:4px 0 0}
/* 마지막 화면 */
.code{font-family:var(--f-mono);font-size:51px;font-weight:500;letter-spacing:.12em;text-align:center;margin:12px 0 4px}
.status{padding:10px 14px;border-radius:6px;margin:12px 0}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.bad{background:var(--warn-bg);color:var(--warn)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
textarea.csv{width:100%;min-height:110px;font-family:var(--f-mono);font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;box-sizing:border-box}
/* 게임 모드 화면 (협력전/경쟁전): 두 모드 모두 같은 크기·색·배치 — 바뀌는 건 이름·그림·규칙 문장뿐 */
.mode .mlabel{font-size:20px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.mode .mname{font-size:54px;font-weight:700;letter-spacing:.06em;line-height:1.2}
.mode .micon{display:block;width:76px;height:76px;margin:14px auto 22px;color:var(--accent)}
.mode .mrule{font-size:23px;margin:0 auto 4px;max-width:30em}
.ricon{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.18em;margin-right:6px;color:var(--accent)}
.rule.small .ricon{width:1em;height:1em}
.memo{border:1.5px solid var(--line);border-radius:8px;padding:10px 18px;margin:10px 0;font-size:16px;line-height:1.6}
.memo b.h{display:block;font-size:17px;margin-bottom:2px}
.memo ul.rules{margin:2px 0 0;gap:1px}
.pts{font-family:var(--f-mono);font-size:15px;color:var(--muted);text-align:center;margin:0 0 8px}
.pts.hi{color:var(--accent);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><b>기억 게임</b><span class="chip" id="chip">안내</span></div>
  <div id="app"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspsych@7.3.4/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.min.js"></script>
<script>
/* =========================================================
   설정값 — 팀에서 바꿀 수 있는 값은 여기에 모아 둠
   ========================================================= */
const CFG = {
  DATAPIPE_ID: "xKAx0QndYl4g",                       // ★ pipe.jspsych.org에서 받은 실험 ID(12자)를 넣으면 자동 배정·자동 전송이 켜짐
  SCENES_PER_BLOCK: 2,                   // 라운드(상대 한 명)당 장면 수. 2 = 장면 4개 모두 / 1 = 장면 2개만 씀
  NEXT_SCENE_MS: 1500,
  MODE_MIN_MS: 2000,                     // 게임 모드(협력전/경쟁전) 화면: 이 시간이 지나야 '다음'이 눌림 (두 모드 동일)
  HARD_P: 0.25,                          // 계산 문제 중 어려운 문제(배점 3점)가 나올 확률 — 쉬운 문제는 1점
  SOURCE_PER_SCENE: { partner: 4, me: 3, none: 3 }, // 출처 검사 장면당 문항: 상대가 말한 정답 / 내가 말한 정답 / 아무도 안 말한 실제 물건 (4장면 → 40문항)
  STUDY_SEC: 60,                         // 장면 학습 시간
  DISTRACT_SEC: 120,                     // 방해 과제(산수) — Park 실험 2 기준 2분
  RECALL_SEC: 180,                       // 공동 회상 카운트다운 (16차례)
  TURNS_EACH: 8,                         // 각자 8번 (참가자 먼저, 총 16차례)
  LURE_TURNS: [3, 5, 7],                 // 상대의 3·5·7번째 차례에 거짓 항목 (첫·마지막 차례 제외)
  EASY_TURNS: [1, 2],                    // 상대의 1·2번째 차례: 잘 떠올리는 물건 (신뢰 쌓기). 나머지(4·6·8)는 덜 떠올리는 물건
  // 사람: 차례 시작~답 표시까지 걸리는 시간을 '본 실험 참가자(11/23, 7명)의 실제 응답 시간'에서 무작위로 뽑음
  //   (참가자 응답 시간 = 상대 답이 뜬 시각 ~ 참가자가 입력한 시각. 15초 넘는 값은 뺌)
  //   상대 1~6번째 차례는 참가자 2~6번째 차례 시간에서, 7~8번째 차례는 참가자 7~8번째 차례 시간에서 뽑음 (뒤로 갈수록 느려지는 패턴)
  //   거짓 항목 차례인지와 관계없이 뽑음 (거짓 항목만 빠르거나 느리면 단서가 되므로)
  HUMAN_LATENCY_POOL: {
    early: [1700,1700,1800,1900,1900,1900,1900,1900,2000,2000,2000,2000,2000,2000,2100,2100,2100,2100,2100,2200,2200,2200,2200,2200,2200,2300,2300,2300,2300,2300,2400,2400,2400,2400,2400,2400,2400,2400,2500,2500,2500,2500,2500,2500,2600,2600,2600,2600,2600,2600,2600,2700,2700,2700,2700,2700,2700,2700,2700,2800,2800,2800,2800,2800,2900,2900,2900,2900,2900,3000,3100,3100,3100,3100,3100,3100,3200,3200,3200,3200,3200,3200,3400,3400,3400,3400,3400,3500,3500,3500,3500,3500,3600,3600,3700,3700,3800,3800,3900,3900,3900,4000,4000,4000,4100,4300,4300,4400,4500,4600,4600,4700,4700,4900,5100,5200,5300,5300,5600,5700,5900,6000,6100,6200,6300,6300,6700,7000,7000,7200,7400,8700,9900,10800,11000,11600,12300,14600],
    late: [1700,1800,1900,2000,2200,2400,2500,2700,2700,2800,3000,3200,3300,3500,3700,3800,4100,4200,4200,4200,4300,4300,4400,4400,4600,4700,4700,4900,5400,5400,5600,6100,6100,6600,6800,6800,7000,7100,7700,8300,8600,9100,9600,10100,10100,10200,12300,12300,12800,14100]
  },
  LATE_FROM_TURN: 7,                     // 상대의 이 차례부터 late 시간에서 뽑음
  THINK_LONG_MS: 4000,                   // 사람: 이보다 오래 걸리는 차례는 처음엔 아무것도 안 보이다가(생각하는 중)
  TYPING_MS: [1500, 2500],               //   마지막 1.5~2.5초에만 '…' 말풍선(입력 중)이 한 번 뜸. 짧은 차례는 처음부터 '…'
  AI_LATENCY_MS: 1500,                   // AI: '응답 생성 중' 뒤 항상 같은 간격 (사람보다 짧음 → 응답 속도도 상대 유형 조작의 일부가 됨)
  HOLD_MS: 1000,                         // 답이 표시된 뒤 내 차례가 오기까지 — 두 조건 동일
  MATCH_MS: [8000, 12000],               // 사람 상대: '찾는 중' → '연결하는 중' 화면 합쳐 8~12초 무작위
  MATCH_MS_AI: 1200,                     // AI 상대: '준비하는 중' 화면 (사람보다 짧음)
  MATCH_DONE_MS: 1800,                   // '매칭 완료 / 준비 완료' 화면 — 두 조건 동일
  ORDER_MS: 2500,                        // 순서 정하기 화면 — 두 조건 동일

    lureGroups: { X: ["포스기","라이터","빨대"], Y: ["감자칩","컵라면","전자레인지"] },
    backupLure: ["마스크"],
    lureAlias: { "포스기":["포스","카드단말기","결제단말기"], "라이터":["가스라이터","일회용라이터"], "빨대":["스트로","스트로우"],
                 "감자칩":["포카칩","프링글스","포테이토칩","감자과자"], "컵라면":["라면","신라면","컵누들"],
                 "전자레인지":["전자렌지","레인지","렌지"], "마스크":[] }
  }
};
// 별칭 표 만들기 + 겹침 점검 (겹치면 콘솔 경고)
const SCENES = {};
for (const [k, d] of Object.entries(SCENE_DEF)) {
  const sc = { key: k, ...d, alias: {} };
  const add = (w, al) => [w, ...al].forEach(a => {
    const n = norm(a);
    if (sc.alias[n] && sc.alias[n] !== w) console.warn(`[${d.name}] '${a}'가 '${sc.alias[n]}'와 '${w}'에 겹침`);
    sc.alias[n] = w;
  });
  Object.entries(d.items).forEach(([w, al]) => add(w, al));
  Object.entries(d.lureAlias).forEach(([w, al]) => { if (d.items[w]) console.warn(`[${d.name}] 거짓 항목 '${w}'가 실제 물건 목록에 있음`); add(w, al); });
  [...d.easy, ...d.hard, ...d.recogStudied].forEach(w => { if (!d.items[w]) console.warn(`[${d.name}] '${w}'가 물건 목록에 없음`); });
  SCENES[k] = sc;
}

/* ---------- 사소한 오타 허용: 한글을 자모(초성·중성·종성)로 풀어 1개만 다르면 그 물건으로 인정 ----------
   채점 기준 문서 규칙: 한 글자 단어, 후보가 둘 이상, 거짓 항목과 가까운 경우는 자동으로 정하지 않고 self_unknown(손 채점)으로 남김 */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ", JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const jamo = s => [...s].flatMap(ch => { const c = ch.charCodeAt(0) - 0xAC00; if (c < 0 || c > 11171) return [ch];
  return [CHO[Math.floor(c / 588)], JUNG[Math.floor((c % 588) / 28)], ...(c % 28 ? [JONG[c % 28]] : [])]; });
function editDist(a, b, cap){ // 편집 거리(바꾸기·넣기·빼기 각 1). cap을 넘으면 cap+1을 돌려줌
  if (Math.abs(a.length - b.length) > cap) return cap + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++){
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++){ cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); best = Math.min(best, cur[j]); }
    if (best > cap) return cap + 1; prev = cur;
  }
  return prev[b.length];
}
const syl = s => [...s].length;
function fuzzyAny(sc, raw){ // 자모 1개 차이로 딱 한 단어(정답·거짓 항목 모두)에만 가까우면 그 단어
  const n = norm(raw); if (syl(n) < 2) return null;
  const J = jamo(n), hits = new Set();
  for (const [a, w] of Object.entries(sc.alias)) if (syl(a) >= 2 && editDist(J, jamo(a), 1) <= 1) hits.add(w);
  return hits.size === 1 ? [...hits][0] : null;
}
const fuzzyMatch = (sc, raw) => { const w = fuzzyAny(sc, raw); return w && sc.items[w] ? w : null; }; // 거짓 항목에 가까우면 자동 인정 안 함
function nearItems(sc, raw){ // 손 채점으로 남은 입력과 비슷한 물건들 → 상대가 그 물건을 말하지 않게 피함
  const n = norm(raw), J = jamo(n), out = new Set();
  for (const [a, w] of Object.entries(sc.alias)){
    if (syl(a) < 2) continue;
    if (editDist(J, jamo(a), 2) <= 2 || (syl(n) >= 2 && (n.includes(a) || a.includes(n)))) out.add(w);
  }
  return [...out];
}

/* =========================================================
   조건 32칸 = 맥락(2) × 상대 순서(2) × 거짓 묶음(2) × 장면 순서(4, 균형 라틴 방격)
   DataPipe는 0,1,2,…를 차례로 돌려줌 → 번호를 아래처럼 쪼개면
     2명마다 맥락이, 4명마다 맥락×상대 순서가, 8명마다 거짓 묶음까지 맞춰지고, 장면 순서는 8명 단위로 돎
   상대는 라운드마다 번갈아 나옴(사람·AI·사람·AI 또는 AI·사람·AI·사람)
   ========================================================= */
const SCENE_ROWS = [["K","L","S","B"], ["L","B","K","S"], ["B","S","L","K"], ["S","K","B","L"]];
function decode(c){
  return { cond: c, context: c & 1 ? "cooperate" : "compete", order: (c >> 1) & 1 ? "ai_first" : "human_first",
           lureSet: (c >> 2) & 1 ? "Y" : "X", sceneRow: (c >> 3) & 3 };
}
async function getCondition(){
  if (FORCED !== null) return { c: FORCED, src: "forced" };
  if (PILOT !== null) return { c: PILOT, src: "pilot" };
  if (DEMO || !CFG.DATAPIPE_ID) return { c: rand(0, N_CONDITIONS - 1), src: DEMO ? "demo_random" : "random_no_datapipe" };
  for (let k = 0; k < 2; k++){
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch("https://pipe.jspsych.org/api/condition/", { method: "POST", signal: ctl.signal,
        headers: { "Content-Type": "application/json", Accept: "*/*" }, body: JSON.stringify({ experimentID: CFG.DATAPIPE_ID }) });
      clearTimeout(t);
      const j = await r.json();
      if (Number.isInteger(j.condition)) return { c: j.condition % N_CONDITIONS, src: "datapipe" };
    } catch (e) {}
    await sleep(1000);
  }
  return { c: rand(0, N_CONDITIONS - 1), src: "random_fallback" }; // 서버가 안 되면 무작위 (기록에 남음)
}

function makeId(){

  };
  el.innerHTML = `
    <div class="recall-head"><h2 style="margin:0">계산 문제</h2><span><span class="timer" id="sc" style="margin-right:16px">점수 0점</span><span class="timer study-timer" id="dt">남은 시간 ${s}초</span></span></div>
    <p class="muted">시간이 끝날 때까지 계산 문제를 최대한 많이 풀어 주세요.<br>문제마다 배점이 다르며, 맞힌 문제의 배점만큼 점수가 쌓입니다. 계산 점수는 개인 기록으로 남습니다.</p>
    <div class="word" id="q"></div>
    <p class="pts" id="pt"></p>
    <div class="inputrow" style="justify-content:center"><input id="a" inputmode="numeric" autocomplete="off" style="flex:0 1 200px" placeholder="답 입력 후 Enter" aria-label="답"><button class="btn" id="ok" type="button">확인</button></div>
    ${S.demo ? '<button class="btn ghost cbtn" id="skip" type="button">(데모) 건너뛰기</button>' : ""}`;
  const q = el.querySelector("#q"), a = el.querySelector("#a"), pt = el.querySelector("#pt");
  const next = () => { cur = make(); q.textContent = cur.q + " = ?"; pt.textContent = `배점 ${cur.pts}점`; pt.className = "pts" + (cur.hard ? " hi" : ""); a.value = ""; a.focus(); };
  const submit = () => {
    const v = a.value.trim(); if (!v) return;
    const D = R.distractor, ok = Number(v) === cur.ans;
    D.n++; if (cur.hard) D.hard_n++;
    if (ok){ D.correct++; D.score += cur.pts; if (cur.hard) D.hard_correct++; }
    el.querySelector("#sc").textContent = `점수 ${D.score}점`; next();
  };
  const end = () => { if (fin) return; fin = true; clearInterval(id); const D = R.distractor; done({ phase: "distractor", block: d.block + 1, n: D.n, correct: D.correct, score: D.score }); };
  a.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); submit(); } });
  el.querySelector("#ok").onclick = submit;
  if (S.demo) el.querySelector("#skip").onclick = end;
  id = setInterval(() => { s--; const e = el.querySelector("#dt"); if (e) e.textContent = `남은 시간 ${s}초`; if (s <= 0) end(); }, 1000);
  next();
};

/* ---------- 공동 회상 ---------- */
REG.recall = (el, d, done) => {
  const R = S.rounds[d.round], sc = SCENES[R.scene], ai = !isHu(R), name = gameName(R), N = CFG.TURNS_EACH;
  const t0 = performance.now(), log = [], said = new Set();
  let pTurns = 0, aTurns = 0, ended = false, left = T("RECALL_SEC"), timer = null;
  el.innerHTML = `
    <div class="recall-head"><h2 style="margin:0">공동 회상 · ${esc(sc.name)} 장면${CFG.SCENES_PER_BLOCK > 1 ? ` (${R.pos + 1}/${CFG.SCENES_PER_BLOCK})` : ""}</h2><span class="timer study-timer" id="rt">남은 시간 ${left}초</span></div>
    <div class="rule small">${ruleText()}</div>
    <p class="muted">번갈아 하나씩, <b>띄어쓰기 없이 붙여서</b> 입력하세요.<br>떠오르지 않으면 '패스'를 누르세요(패스도 한 차례로 계산됩니다).</p>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="turnbar"><span id="turn"></span><span class="cnt" id="cnt"></span></div>
    <div class="inputrow"><input id="inp" autocomplete="off" placeholder="물건 이름 (띄어쓰기 없이) 입력 후 Enter" aria-label="물건 이름">
      <button class="btn" id="send" type="button">입력</button><button class="btn ghost" id="pass" type="button">패스</button></div>
    <div class="warn" id="warn" role="status"></div>`;
  const $ = id => el.querySelector("#" + id), inp = $("inp"), box = $("log");
  const DOTS = '<span class="tdots" aria-label="입력 중"><i></i><i></i><i></i></span>';
  const ms = () => Math.round(performance.now() - t0);
  const scroll = () => { box.scrollTop = box.scrollHeight; };
  const count = () => { $("cnt").textContent = `내 차례 ${pTurns}/${N} · 상대 차례 ${aTurns}/${N}`; };
  // 내 차례: 내 쪽 말풍선에 '…'(입력 중) 표시. 입력 내용은 확정(Enter)한 뒤에만 말풍선에 나옴
  let draft = null;
  const showDraft = () => {
    if (!draft){
      draft = document.createElement("div"); draft.className = "row me";
      draft.innerHTML = `<div class="msg me typing"><small>${esc(S.myName)} (나)</small><span class="txt"></span></div>${myAvatar()}`;
      box.appendChild(draft);
    }
    draft.querySelector(".txt").innerHTML = DOTS; scroll();
  };
  const addMe = (text, cls = "") => {
    if (!draft) showDraft();
    const m = draft.querySelector(".msg"); m.classList.remove("typing"); if (cls) m.classList.add(cls);
    draft.querySelector(".txt").textContent = text; draft = null; scroll();
  };
  const addThem = () => {
    const r = document.createElement("div"); r.className = "row them";
    r.innerHTML = `${avatar(R)}<div class="msg them typing"><small>${esc(name)}</small><span class="txt"></span></div>`;
    box.appendChild(r); scroll(); return r.querySelector(".msg");
  };
  const myTurn = on => {
    inp.disabled = !on; $("send").disabled = !on; $("pass").disabled = !on;
    $("turn").textContent = on ? "내 차례예요" : `${name} 차례`;
    count(); if (on){ inp.focus(); showDraft(); }
  };
  const clock = setInterval(() => { left--; $("rt").textContent = `남은 시간 ${Math.max(left, 0)}초`; if (left <= 0) finish("timeout"); }, 1000);

  const unknownSaid = new Set(), avoid = new Set(); // avoid: 손 채점 입력과 비슷해 상대가 말하지 않을 물건
  const submit = () => {
    if (inp.disabled || ended) return;
    const raw = inp.value.trim(); if (!raw) return;
    if (/\s/.test(raw)){ $("warn").textContent = "띄어쓰기 없이 붙여서 입력해 주세요. (예: '전기 포트' → '전기포트')"; R.warnings.push({ raw, kind: "space", t_ms: ms() }); inp.select(); return; }
    let canon = sc.alias[norm(raw)], fz = false, near = [];
    if (!canon){
      const any = fuzzyAny(sc, raw);
      if (any && said.has(any)){ $("warn").textContent = "이미 나온 물건이에요."; R.warnings.push({ raw, kind: "duplicate", t_ms: ms() }); inp.select(); return; } // 이미 나온 단어의 오타
      if (any && sc.items[any]){ canon = any; fz = true; }
    }
    let type;
    if (!canon){
      if (CFG.STRICT_INPUT){ $("warn").textContent = "이 장면에 없던 물건이에요. 다른 물건을 입력해 주세요."; R.warnings.push({ raw, kind: "not_in_scene", t_ms: ms() }); inp.select(); return; }
      if (unknownSaid.has(norm(raw))){ $("warn").textContent = "이미 나온 물건이에요."; R.warnings.push({ raw, kind: "duplicate", t_ms: ms() }); inp.select(); return; }
      unknownSaid.add(norm(raw)); type = "self_unknown"; // 손 채점 대상
      near = nearItems(sc, raw); near.forEach(w => avoid.add(w));
    } else {
      if (said.has(canon)){ $("warn").textContent = "이미 나온 물건이에요."; R.warnings.push({ raw, kind: "duplicate", t_ms: ms() }); inp.select(); return; }
      // 준비된 거짓 항목을 참가자가 먼저 말한 경우: 경고 없이 통과하고, 상대는 대체 후보를 씀
      type = sc.items[canon] ? "self_studied" : "self_lure";
      said.add(canon);
    }
    pTurns++; $("warn").textContent = ""; inp.value = "";
    addMe(raw); log.push({ by: "participant", turn: pTurns, raw, item: canon || "", type, t_ms: ms(), ...(fz ? { fuzzy: 1 } : {}), ...(near.length ? { near } : {}) });
    myTurn(false); partnerTurn();
  };
  const pass = () => {
    if (inp.disabled || ended) return;
    pTurns++; $("warn").textContent = ""; inp.value = "";
    addMe("(패스)", "pass"); log.push({ by: "participant", turn: pTurns, raw: "", item: "", type: "pass", t_ms: ms() });
    myTurn(false); partnerTurn();
  };

  // 상대 차례: 내용·순서는 사람/AI 조건 모두 같은 대본, 보이는 방식만 다름
  const first = list => list.find(w => !said.has(w) && !avoid.has(w));
  R.lureOrder = shuffle(sc.lureGroups[S.lureSet]); // 3·5·7번 차례에 어떤 거짓 항목이 나올지 장면마다 무작위
  const nextItem = t => {
    if (CFG.LURE_TURNS.includes(t)){
      const w = first([...R.lureOrder, ...sc.backupLure]);
      if (w) return { item: w, type: "partner_lure" };
    }
    const order = CFG.EASY_TURNS.includes(t) ? [...sc.easy, ...sc.hard] : [...sc.hard, ...sc.easy];
    const rest = Object.keys(sc.items).filter(w => !sc.recogStudied.includes(w) && !(sc.acceptOnly || []).includes(w));
    return { item: first(order) || first(rest) || first(Object.keys(sc.items)) || Object.keys(sc.items).find(w => !said.has(w)), type: "partner_studied" };
  };
  const partnerTurn = () => {
    if (ended) return;
    aTurns++; count();
    const turnNo = aTurns, start = performance.now(), { item, type } = nextItem(turnNo);
    said.add(item);
    const bubble = addThem(), txt = bubble.querySelector(".txt");
    const row = bubble.parentElement;
    const reveal = () => {
      if (ended) return;
      row.hidden = false; bubble.classList.remove("typing"); txt.textContent = item; scroll();
      log.push({ by: "partner", turn: turnNo, raw: item, item, type, latency_ms: Math.round(performance.now() - start), t_ms: ms() });
      timer = setTimeout(() => { if (ended) return; if (aTurns >= N) finish("done"); else myTurn(true); }, CFG.HOLD_MS);
    };
    if (ai){
      // AI: "응답 생성 중" 뒤 매번 같은 간격으로 단어가 한 번에 뜸
      txt.innerHTML = '응답 생성 중<span class="dots"></span>';
      timer = setTimeout(reveal, CFG.AI_LATENCY_MS);
    } else {
      // 사람: 실제 참가자 응답 시간에서 뽑은 만큼 기다린 뒤 답 표시.
      // 오래 걸리는 차례는 생각하는 동안 아무것도 안 보이다가 마지막에만 '…'(입력 중)이 뜸
      const pool = turnNo >= CFG.LATE_FROM_TURN ? CFG.HUMAN_LATENCY_POOL.late : CFG.HUMAN_LATENCY_POOL.early;
      const wait = pick(pool);
      txt.innerHTML = DOTS;
      if (wait > CFG.THINK_LONG_MS){
        row.hidden = true;
        const typing = rand(CFG.TYPING_MS[0], CFG.TYPING_MS[1]);
        setTimeout(() => { if (!ended){ row.hidden = false; scroll(); } }, wait - typing);
      }
      timer = setTimeout(reveal, wait);
    }
  };

  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); submit(); } }); // 한글 조합 중 Enter 중복 방지
  $("send").onclick = submit; $("pass").onclick = pass;
  myTurn(true);

  const finish = reason => {
    if (ended) return; ended = true; clearInterval(clock); clearTimeout(timer);
    R.recall = log; R.end = reason;
    done({ phase: "recall", round: d.round + 1, scene: R.scene, end_reason: reason });
  };
};

/* ---------- 재인 목록 (보통 12문항): 실제 언급 기록으로 거짓 항목 유형을 정함 ---------- */
function buildRecog(r){
  const R = S.rounds[r], sc = SCENES[R.scene], by = {}, items = [];
  R.recall.forEach(m => { if (m.item) by[m.item] = m.type; });
  sc.recogStudied.forEach(w => items.push({ word: w, kind: "studied", mention: by[w] || "unmentioned" }));
  [...sc.lureGroups[S.lureSet], ...sc.backupLure].forEach(w => { if (by[w] === "partner_lure") items.push({ word: w, kind: "lure", lure_type: "partner_lure" }); });
  const nearSelf = new Set(R.recall.filter(m => m.by === "participant").flatMap(m => m.near || [])); // 참가자가 오타로 말한 듯한 거짓 항목
  sc.lureGroups[S.lureSet === "X" ? "Y" : "X"].forEach(w => items.push({ word: w, kind: "lure",
    lure_type: by[w] === "self_lure" ? "self_lure" : nearSelf.has(w) ? "self_lure_near" : "unmentioned_lure" })); // self_lure·self_lure_near는 기저선(FA)에서 빠짐
  R.recog = shuffle(items); R.recogResp = [];
}

/* ---------- 출처 검사 (주의): 예고 없이, 장면당 10문항 ----------
   구성 고정: 상대가 말한 정답 4 / 내가 말한 정답 3 / 아무도 말하지 않은 실제 물건 3
     - '아무도' 문항은 장면에 실제로 있었지만 아무도 입력하지 않은 물건만 씀 (장면에 없던 거짓 항목은 넣지 않음)
       → 거짓 항목은 '본 적 없음'으로 쉽게 걸러져 찍기 경향(FA)을 재지 못하고, 섞이는 비율이 사람마다 달라지면 FA가 흔들리기 때문
     - 주의 점수 = '상대' 맞힘(상대가 말한 정답) − '상대' 오답(아무도 말하지 않은 실제 물건만 분모)
     - 다른 장면의 물건 이름·표기와 겹치는 단어(예: 숟가락·의자·테이블), 손 채점 입력과 비슷한 단어는 누가 말했는지 애매해 뺌
   같은 단어가 두 장면에 나올 수 있어 장면 이름을 함께 보여 줌 */
const CROSS = {};
for (const k of Object.keys(SCENES)) CROSS[k] = new Set(Object.keys(SCENES[k].items).filter(w => Object.keys(SCENES).some(o => o !== k && SCENES[o].alias[norm(w)])));
function buildSource(){
  const N = CFG.SOURCE_PER_SCENE, list = [];
  S.rounds.forEach(R => {
    const sc = SCENES[R.scene], base = { round: R.idx + 1, scene: R.scene, partner: R.partner };
    const said = new Set(R.recall.filter(m => m.item).map(m => m.item));
    const near = new Set(R.recall.flatMap(m => m.near || []));
    const ok = w => !CROSS[R.scene].has(w) && !near.has(w);
    const take = (arr, n) => shuffle(arr).slice(0, n);
    const pa = take(R.recall.filter(m => m.by === "partner" && m.type === "partner_studied" && ok(m.item)), N.partner);
    const me = take(R.recall.filter(m => m.by === "participant" && m.type === "self_studied" && ok(m.item)), N.me);
    const inRecog = new Set(R.recog.map(x => x.word));
    const unsaid = Object.keys(sc.items).filter(w => !said.has(w) && ok(w) && !(sc.acceptOnly || []).includes(w));
    const none = [...take(unsaid.filter(w => inRecog.has(w)), 99), ...take(unsaid.filter(w => !inRecog.has(w)), 99)].slice(0, N.none); // 재인에 나온 물건 먼저
    pa.forEach(m => list.push({ ...base, word: m.raw || m.item, item: m.item, truth: "partner", type: m.type }));
    me.forEach(m => list.push({ ...base, word: (m.raw || m.item).trim(), item: m.item, truth: "me", type: m.type }));   // 11/21: 내가 말한 물건은 내가 입력한 표현 그대로 보여 줌
    none.forEach(w => list.push({ ...base, word: w, truth: "none", type: "studied_unmentioned", in_recog: inRecog.has(w) ? 1 : 0 }));
    R.srcShort = (N.partner - pa.length) + (N.me - me.length) + (N.none - none.length); // 0이 정상. 모자라도 다른 유형으로 채우지 않음
  });
  S.source = shuffle(list);
}
REG.source = (el, d, done) => {
  setChip("추가 질문");
  buildSource();
  const L = S.source, OPTS = [["me", "내가 입력함"], ["partner", "상대가 입력함"], ["none", "아무도 입력하지 않음"]];
  let i = 0, t0 = 0;
  const show = () => {
    if (i >= L.length) return done({ phase: "source", n: L.length });
    el.innerHTML = `
      <p class="muted" style="text-align:center">${i + 1} / ${L.length}</p>
      <span class="tag">${esc(SCENES[L[i].scene].name)} 장면</span>
      <div class="word">${esc(L[i].word)}</div>

/* =========================================================
   자료 1인 1행
     - 상대 유형별(human_*, ai_*): 두 라운드 문항을 합쳐 계산한 지표 → 주 분석용
     - 라운드별(r1_* … r4_*): 장면·순서 효과 확인용 + 기록(JSON)
   ========================================================= */
const r3 = v => v == null ? "" : +v.toFixed(3);
function rates(resp){
  const rate = f => { const a = resp.filter(f); return a.length ? a.filter(x => x.said_yes).length / a.length : null; };
  const hit = rate(x => x.kind === "studied"), faP = rate(x => x.lure_type === "partner_lure"), faU = rate(x => x.lure_type === "unmentioned_lure");
  return { hit: r3(hit), fa_partner: r3(faP), fa_unmentioned: r3(faU), contagion: faP != null && faU != null ? r3(faP - faU) : "",
           n_studied_items: resp.filter(x => x.kind === "studied").length, n_partner_lure_items: resp.filter(x => x.lure_type === "partner_lure").length,
           n_unmentioned_items: resp.filter(x => x.lure_type === "unmentioned_lure").length };
}
function srcStats(src){
  const prop = (f, ans) => { const a = src.filter(f); return a.length ? a.filter(x => x.resp === ans).length / a.length : null; };
  return {
    attention: r3(prop(x => x.type === "partner_studied", "partner")),         // 주의: 상대가 말한 정답 항목을 '상대'로 맞힌 비율
    attention_fa: r3(prop(x => x.truth === "none", "partner")),                // 아무도 말하지 않은 실제 물건을 '상대'로 고른 비율 (찍기 경향) — 분모는 '아무도' 문항만
    attention_corrected: (() => { const h = prop(x => x.type === "partner_studied", "partner"), f = prop(x => x.truth === "none", "partner");
                                  return h != null && f != null ? r3(h - f) : ""; })(),   // 주의 − 찍기 경향
    n_src_partner_studied: src.filter(x => x.type === "partner_studied").length,
    n_src_none: src.filter(x => x.truth === "none").length,
    n_src_total: src.length,
    src_self_correct: r3(prop(x => x.truth === "me", "me")),
    src_none_correct: r3(prop(x => x.truth === "none", "none"))
  };
}
function roundSumm(R){
  const logs = R.recall, cnt = f => logs.filter(f).length;
  const src = S.source.filter(x => x.round === R.idx + 1 && x.resp);
  return {
    block: R.block + 1, pos_in_block: R.pos + 1, partner: R.partner, scene: SCENES[R.scene].name, ...rates(R.recogResp),
    recall_correct: cnt(m => m.type === "self_studied"), recall_self_lure: cnt(m => m.type === "self_lure"),
    recall_unknown: cnt(m => m.type === "self_unknown"), recall_pass: cnt(m => m.type === "pass"),
    partner_lures_shown: cnt(m => m.type === "partner_lure"),
    recall_end: R.end, n_warnings: R.warnings.length, distractor_n: S.blocks[R.block].distractor.n, distractor_correct: S.blocks[R.block].distractor.correct,
    distractor_score: S.blocks[R.block].distractor.score ?? "", distractor_hard_n: S.blocks[R.block].distractor.hard_n ?? "", distractor_hard_correct: S.blocks[R.block].distractor.hard_correct ?? "",
    ...srcStats(src),
    warnings_log: JSON.stringify(R.warnings.map(w => ({ raw: w.raw, kind: w.kind }))),
    recall_log: JSON.stringify(logs.map(m => ({ by: m.by === "participant" ? "P" : "C", turn: m.turn, raw: m.raw, item: m.item, type: m.type, t: m.t_ms, lat: m.latency_ms, fz: m.fuzzy, nr: m.near }))),
    lure_order: (R.lureOrder || []).join("-"),
    recog_log: JSON.stringify(R.recogResp.map(x => ({ w: x.word, type: x.lure_type || ("studied_" + x.mention), yes: x.said_yes ? 1 : 0, rt: x.rt }))),
    src_short: R.srcShort ?? "",
    source_log: JSON.stringify(src.map(x => ({ w: x.word, item: x.item || x.word, type: x.type, truth: x.truth, resp: x.resp, rt: x.rt, rg: x.in_recog })))
  };
}
function buildRow(){
  const row = { participant_id: S.pid, completion_code: S.code, session_start: S.startISO, duration_min: +((Date.now() - S.tStart) / 60000).toFixed(1),
                demo: S.demo ? 1 : 0, entry_code: S.entry, human_name: S.humanName, condition: S.cond, assign_source: S.assign, context: S.context, partner_order: S.order,
                lure_set: S.lureSet, scene_order: S.sceneOrder.map(k => SCENES[k].name).join("-"), n_scenes: S.rounds.length, scenes_per_round: CFG.SCENES_PER_BLOCK,
                strict_input: CFG.STRICT_INPUT ? 1 : 0, screen: `${screen.width}x${screen.height}`, viewport: `${innerWidth}x${innerHeight}` };
  for (const p of ["human", "ai"]){
    const rs = S.rounds.filter(R => R.partner === p); if (!rs.length) continue;
    const tr = S.trust[p] || {};
    Object.entries({ scenes: rs.map(R => SCENES[R.scene].name).join("-"), ...rates(rs.flatMap(R => R.recogResp)),
      ...srcStats(S.source.filter(x => x.partner === p && x.resp)), partner_acc: tr.partner_acc ?? "", self_acc: tr.self_acc ?? "" })
      .forEach(([k, v]) => row[`${p}_${k}`] = v);
  }
  S.rounds.forEach(R => Object.entries(roundSumm(R)).forEach(([k, v]) => row[`r${R.idx + 1}_${k}`] = v));
  // 사후 질문 열 순서는 화면 순서와 관계없이 11/23 자료와 똑같이 고정 (CSV를 그대로 합칠 수 있게)
  ["believed_human","believed_ai","felt_context","source_expected","purpose_guess","odd_notes"].forEach(k => { if (k in S.post) row[k] = S.post[k]; });
  // 제외 기준: 불신은 자동 표시, 목적 추측(거짓 항목·기억 왜곡 언급)은 실험자가 purpose_guess를 읽고 손으로 1/0 입력
  Object.assign(row, { excl_disbelief: (S.post.believed_human === "아니요" || S.post.believed_ai === "아니요") ? 1 : 0, excl_purpose: "", data_consent: 1 });
  return row;
}
function toCSV(rows){
  if (!rows.length) return "";
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];
  const cell = v => { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [cols.join(","), ...rows.map(r => cols.map(c => cell(r[c])).join(","))].join("\r\n");
}
function download(text, fname){
  try {
    const url = URL.createObjectURL(new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" })); // BOM: 엑셀 한글 깨짐 방지
    const a = document.createElement("a"); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch (e) {}
}

/* ---------- 전송: DataPipe → 팀 구글 드라이브 자료 폴더 (참가자 노트북에는 아무것도 남기지 않음) ---------- */
async function sendOnce(){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch("https://pipe.jspsych.org/api/data/", { method: "POST", signal: ctl.signal,
      headers: { "Content-Type": "application/json", Accept: "*/*" },
      body: JSON.stringify({ experimentID: CFG.DATAPIPE_ID, filename: `${S.pid}.csv`, data: S.csv }) });
    const j = await r.json().catch(() => ({}));
    return r.ok && !j.error ? { ok: true } : { ok: false, why: j.error || `HTTP ${r.status}` };
  } catch (e) { return { ok: false, why: e.name === "AbortError" ? "시간 초과" : "연결 실패" }; }
  finally { clearTimeout(t); }
}
function startUpload(){
  // 자료 사용을 거부하면 응답은 보내지 않고, 완료 확인·배정 집계에 필요한 최소 정보만 보냄 (merge.html이 자동으로 분석에서 뺌)
  S.csv = toCSV([S.consent === 0
    ? { participant_id: S.pid, completion_code: S.code, session_start: S.startISO, demo: S.demo ? 1 : 0, condition: S.cond, assign_source: S.assign, data_consent: 0 }
    : buildRow()]);
  if (S.demo){ S.upload = Promise.resolve({ ok: false, why: "demo" }); return; }
  if (!CFG.DATAPIPE_ID){ S.upload = Promise.resolve({ ok: false, why: "no_datapipe" }); return; }
  S.upload = (async () => {
    let res;
    for (let k = 0; k < 3; k++){ res = await sendOnce(); if (res.ok) return res; await sleep(1500 * (k + 1)); }
    return res;
  })();
}

    <p>상대의 답이 대본이고 일부가 사실과 다르다는 것을 미리 알리면, 답을 의식적으로 의심하거나 기억 검사의 응답 방식이 바뀔 수 있습니다.<br>
    연구 결과에 이런 영향이 생기지 않도록 일부 정보를 미리 알리지 않았습니다.<br>
    이 과정에서 혼란이나 불편함을 느끼셨다면 양해 부탁드립니다.<br>
    궁금한 점은 지금 실험자에게 편하게 물어봐 주세요.</p>
    <div class="rule">아직 참여하지 않은 분들의 결과가 달라질 수 있으니, 실험 내용을 다른 사람에게 말하지 말아 주세요.</div>
    <h3>4. 연구 자료 사용 확인</h3>
    <p>방금 남겨 주신 응답은 AI가 사람의 기억에 얼마나 스며드는지 알아보는 데 꼭 필요한 자료입니다.<br>
    한 분 한 분의 자료가 결과에 그대로 반영되기 때문에, 함께해 주시면 연구에 큰 힘이 됩니다.<br>
    자료에는 이름이나 학번이 없으며, 개인을 알아볼 수 없는 형태로만 분석하고 발표합니다.</p>
    <p class="muted">위 설명(실제 연구 목적, 대본 사용, 거짓 항목, 보상 규칙)을 읽고 궁금한 점을 물어볼 수 있었다면, 아래에서 골라 주세요.<br>
    원하지 않으시면 자료 제외를 고르실 수 있습니다. 어느 쪽을 골라도 불이익은 없고, 간식도 똑같이 드립니다.</p>
    <div class="btnrow">
      <button class="btn" type="button" data-c="1">네, 제 자료를 연구에 써도 좋아요</button>
      <button class="btn ghost" type="button" data-c="0" style="color:var(--ink)">아니요, 제 자료는 빼 주세요</button>
    </div>
    <p class="muted">나중에 마음이 바뀌면 다음 화면의 완료 코드를 실험자에게 알려 주세요. 분석 전이라면 자료를 빼 드립니다.</p>`;
  el.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    S.consent = Number(b.dataset.c);
    startUpload(); // 고른 뒤에 전송 (거부하면 응답 없이 최소 정보만)
    done({ phase: "debrief", data_consent: S.consent });
  });
};

/* ---------- 마지막 화면: 완료 코드 (실험자가 확인) ---------- */
REG.finish = async (el, d, done) => {
  setChip("완료");
  el.innerHTML = `<h2>제출하는 중…</h2><p class="muted"><span class="spin"></span>잠시만 기다려 주세요.<br>창을 닫지 마세요.</p>`;
  const show = res => {
    if (res.ok){
      removeEventListener("beforeunload", guard);
      el.innerHTML = `<h2>모든 과정이 끝났습니다</h2>
        <div class="status ok">${S.consent === 0 ? "요청하신 대로 게임 응답은 저장하지 않았습니다." : "답변이 안전하게 제출되었습니다."}</div>
        <p>아래 완료 코드가 보이는 화면을 실험자에게 보여 주세요.</p>
        <div class="code">${esc(S.code)}</div>
        <p class="muted" style="text-align:center">확인을 받은 뒤 창을 닫으셔도 됩니다.</p>`;
      return;
    }
    const why = { demo: "데모 모드라 전송하지 않았어요.", no_datapipe: "전송 설정(DATAPIPE_ID)이 비어 있어 전송하지 않았어요." }[res.why];
    el.innerHTML = `<h2>${why ? "데모 · 점검 화면" : "제출이 아직 안 됐어요"}</h2>
      <div class="status bad">${why || `인터넷 연결 문제로 답변이 전송되지 않았어요 (${esc(res.why)}). 창을 닫지 말고 실험자를 불러 주세요.`}</div>
      <p class="muted">완료 코드 <b style="font-family:var(--f-mono)">${esc(S.code)}</b></p>
      <div class="btnrow">${why ? "" : '<button class="btn" id="retry" type="button">다시 보내기</button>'}<button class="btn ghost" id="dl" type="button">(실험자용) CSV 내려받기</button></div>
      <p class="muted">${why ? "" : "다시 보내기가 계속 실패하면 실험자가 CSV를 내려받아 가져간 뒤, 이 노트북의 다운로드 폴더에서 파일을 지워 주세요."}</p>
      ${S.demo ? `<h3>이 참가자 행</h3><textarea class="csv" readonly>${esc(S.csv)}</textarea>` : ""}`;
    el.querySelector("#dl").onclick = () => download(S.csv, `${S.pid}.csv`);
    const rt = el.querySelector("#retry");
    if (rt) rt.onclick = async () => { rt.disabled = true; rt.textContent = "보내는 중…"; show(await sendOnce()); };
    if (why) removeEventListener("beforeunload", guard);
  };
  show(await S.upload);
};

/* =========================================================
   타임라인
   ========================================================= */
const timeline = [];
/* 커버스토리 + 입장 코드. 코드가 맞아야 '시작'이 눌림 → 그 뒤에 조건을 받으므로, 집에서 미리 열어도 조건 칸이 쓰이지 않음 */
const NEED_CODE = CFG.ENTRY_CODES.length > 0 && !DEMO && FORCED === null && PILOT === null;
REG.cover = (el, d, done) => {
  setChip("안내");
  el.innerHTML = `<h2>기억 게임 연구</h2>
    <p>이 연구는 기억 게임을 통해 사용자의 경험과 기억 수행을 살펴봅니다.<br>게임은 두 라운드로 구성됩니다: 한 라운드는 다른 방에서 접속하는 참가자와, 다른 한 라운드는 AI 플레이어와 진행합니다.<br>라운드마다 연속해서 장면 ${CFG.SCENES_PER_BLOCK}개가 등장하며, 각 장면에 있는 물건을 안내에 따라 외워 주시면 됩니다.</p>
    <ul class="rules">
      <li>실험자의 안내에 따라 시작을 눌러 주세요.</li>
      <li>게임이 끝날 때까지 이 창을 닫거나 새로고침하지 마세요.</li>
    </ul>
    ${NEED_CODE ? `<div class="form"><label for="ec">입장 코드 (실험자가 알려 드려요)<input id="ec" autocomplete="off" maxlength="20" style="max-width:220px"></label></div><div class="warn" id="warn" role="status"></div>` : ""}
    ${DEMO ? '<p class="muted">[데모 모드 — 시간 단축 · 전송 안 함 · 입장 코드 없음]</p>' : FORCED !== null ? `<p class="muted">[점검 모드 — 조건 ${FORCED} 고정 · 입장 코드 없음]</p>` : ""}
    <button class="btn cbtn" id="go" type="button">시작</button>`;
  const ec = el.querySelector("#ec"), go = () => {
    if (NEED_CODE){
      const v = norm(ec.value);
      if (!CFG.ENTRY_CODES.map(norm).includes(v)){ el.querySelector("#warn").textContent = v ? "입장 코드가 맞지 않아요. 실험자가 알려 준 코드를 다시 확인해 주세요." : "입장 코드를 입력해 주세요."; ec.focus(); return; }
      S.entry = ec.value.trim();
    }
    done({ phase: "cover_story" });
  };
  el.querySelector("#go").onclick = go;
  if (ec){ ec.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); go(); } }); ec.focus(); }
};
timeline.push(fn("cover"));
timeline.push(fn("prepare"));
timeline.push(fn("register"));

/* 라운드(=상대 한 명) 하나 = Roediger 등(2001)·Park 등(2016) 방식의 블록
   장면들 연속 학습 → 계산 문제 1번 → 순서 정하기 → 장면별 공동 회상(학습 순서대로) → 장면별 재인(학습 순서대로) */
function blockTimeline(b){
  const B = () => S.blocks[b], tl = [], NB = 2, SPB = CFG.SCENES_PER_BLOCK;
  const sc = j => SCENES[S.rounds[B().scenes[j]].scene];
  tl.push(fn("mode", { block: b })); // 게임 모드 (협력전/경쟁전)
  tl.push({ // 이번 라운드 상대 + 보상 규칙 (이름 없이)
    type: jsPsychHtmlButtonResponse,
    stimulus: () => `<p class="muted">라운드 ${b + 1} / ${NB}</p><h2>이번 라운드 상대</h2>
      <div class="pcard">${avatar(B(), true)}<div><b>${anonName(B())}</b><span class="muted">${isHu(B()) ? "다른 곳에서 접속" : "컴퓨터가 응답"}</span></div></div>
      <div class="rule">${ruleText()}</div>
      ${b === 0 ? `<div class="memo"><b class="h">무엇을 외우나요?</b>
        <ul class="rules">
          <li>사진 속에 있는 물건의 이름을 외우세요.</li>
          <li>가구, 생활용품뿐만 아니라 벽이나 바닥에 붙어 있는 것도 물건입니다.</li>
          <li>다만 벽, 바닥, 천장 같은 공간 자체나 색깔, 무늬는 물건에 해당하지 않습니다.</li>
          <li>물건 하나는 이름 하나로 말합니다. (예: 칠판, 사물함 O / 학용품, 가구 X)</li>
          <li>같은 물건이 여러 개 있어도 한 번만 말합니다.</li>
          <li>흔히 부르는 다른 이름이나 상품 이름도 인정됩니다.</li>
        </ul></div>` : ""}
      ${SPB > 1 ? `<div class="note">장면 <b>${SPB}개</b>가 <b><u>연속으로</u></b> 제시됩니다 (각 ${T("STUDY_SEC")}초).<br>첫 장면이 끝나면 곧바로 다음 장면이 나오니, <b>두 장면의 물건을 모두</b> 외워 주세요.</div>` : ""}
      <p class="muted">게임은 장면 학습${SPB > 1 ? "" : `(${T("STUDY_SEC")}초)`}, 계산 문제, 공동 회상 순서로 진행됩니다.</p>`,
    choices: ["다음"], data: { phase: "round_intro", block: b + 1 },
    on_load: () => setChip(`라운드 ${b + 1} / ${NB}`)
  });
  tl.push(fn("matching", { block: b })); // 연결/준비 → 매칭 완료 연출 (두 조건 같은 시간)
  for (let j = 0; j < SPB; j++){
    if (j > 0) tl.push({ type: jsPsychHtmlButtonResponse, stimulus: `<h2 class="ctr" style="margin:0;font-size:34px">다음 장면</h2>`,
                         choices: [], trial_duration: CFG.NEXT_SCENE_MS, data: { phase: "next_scene", block: b + 1 } });
    tl.push(fn("study", { round: b * SPB + j }));
  }
  tl.push(fn("distract", { block: b }));
  tl.push(fn("order", { block: b }));
  tl.push({ // 공동 회상 규칙: 왜 내가 먼저인지, 왜 상대가 정해진 수에서 멈추는지
    type: jsPsychHtmlButtonResponse,
    stimulus: () => {
      const both = SPB > 1 ? "두 장면의 회상 모두에서" : "회상에서";
      const firstLine = isHu(B())
        ? `순서 정하기 결과에 따라 <span class="idbox">${esc(S.myName)}</span>가 ${both} 먼저 입력합니다.`
        : `${both} <b>당신이 먼저</b> 입력합니다.`;
      return `<h2>공동 회상</h2>
      <p>${anonName(B())}와 번갈아 가며, 방금 본 장면에 있던 물건을 하나씩 입력합니다.${SPB > 1 ? `<br>장면을 본 순서대로 ${B().scenes.map(k => SCENES[S.rounds[k].scene].name + " 장면").join(", ")}을 하나씩 진행합니다.` : ""}</p>
      <ul class="rules">
        <li>${firstLine}</li>
        <li>각자 <b>${CFG.TURNS_EACH}번씩</b> 단어를 입력합니다.</li>
        <li>떠오르지 않으면 '패스'를 누르세요.</li>
        <li>패스도 한 차례로 계산됩니다.</li>
        <li>둘 다 ${CFG.TURNS_EACH}번씩, ${CFG.TURNS_EACH * 2}차례를 마치면 공동 회상이 끝납니다.</li>
        <li>장면당 제한 시간은 <b>${Math.round(T("RECALL_SEC") / 60)}분</b>입니다.</li>
        <li>물건 이름은 띄어쓰기 없이 붙여서 입력합니다. (예: 전기 포트 → 전기포트)</li>
        <li>이미 나온 물건은 다시 입력할 수 없습니다.</li>
      </ul>
      <div class="rule">${ruleText()}</div>`; },
    choices: ["시작"], data: { phase: "recall_instructions", block: b + 1 }
  });
  for (let j = 0; j < SPB; j++){
    if (j > 0) tl.push({ type: jsPsychHtmlButtonResponse,
      stimulus: () => `<h2>다음 장면: ${esc(sc(j).name)}</h2><p>같은 상대와 <b>${esc(sc(j).name)}</b> 장면의 공동 회상을 이어서 합니다.</p>`,
      choices: ["시작"], data: { phase: "recall_next", block: b + 1 } });
    tl.push(fn("recall", { round: b * SPB + j }));
  }
  tl.push({ // 개별 재인 안내 — Huang 등: "학습 단계 기준" 지시
    type: jsPsychHtmlButtonResponse,
    stimulus: () => `<h2>혼자 답하기</h2><p>단어가 하나씩 제시되면, 장면 사진에 실제로 있었던 물건인지를 "예" 또는 "아니요"로 판단해 주세요.</p>
      <p>화면 상단에 어느 장면을 기준으로 판단하는지가 표시됩니다.</p>`,
    choices: ["시작"], data: { phase: "recog_instructions", block: b + 1 },
    on_start: () => B().scenes.forEach(k => buildRecog(k))
  });
  for (let j = 0; j < SPB; j++){
    const R = () => S.rounds[B().scenes[j]];
    for (let i = 0; i < 14; i++){ // 실제 문항 수(보통 12)만큼만 실행
      tl.push({
        timeline: [{
          type: jsPsychHtmlButtonResponse,
          stimulus: () => `<p class="muted" style="text-align:center">${i + 1} / ${R().recog.length}</p><span class="tag"><b>${esc(SCENES[R().scene].name)} 장면</b></span><div class="word">${esc(R().recog[i].word)}</div><p class="muted" style="text-align:center"><b>${esc(SCENES[R().scene].name)} 장면</b> 사진에 있었나요?</p>`,
          choices: ["예, 있었어요", "아니요"],
          on_finish: dt => {
            const it = R().recog[i], said_yes = dt.response === 0;
            R().recogResp.push({ ...it, said_yes, rt: Math.round(dt.rt) });
            Object.assign(dt, { phase: "recognition", block: b + 1, round: R().idx + 1, partner: R().partner, item: it.word, kind: it.kind, lure_type: it.lure_type || null, said_yes });
          }
        }],
        conditional_function: () => i < R().recog.length
      });
    }
  }
  return tl;
}
timeline.push(...blockTimeline(0), ...blockTimeline(1));

timeline.push(fn("source")); // 주의: 출처 검사 (재인 뒤, 예고 없이)
timeline.push(fn("trust", { pi: 0 }), fn("trust", { pi: 1 }));  // 신뢰: 기억 정확도 평정 (재인 뒤 — 앞에 두면 상대 답을 따져 보게 해 전염이 줄 수 있음)
timeline.push(fn("post", { pg: 0 }), fn("post", { pg: 1 }));

timeline.push(fn("debrief")); // 사후 설명 + 자료 사용 확인 → 고른 뒤 전송
timeline.push(fn("finish"));

jsPsych.run(timeline);
</script>
